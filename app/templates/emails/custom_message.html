<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#0a0a0a;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0a0a;padding:40px 20px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color:#141414;border-radius:12px;overflow:hidden;border:1px solid #222;">
                    <tr>
                        <td style="background:linear-gradient(135deg,#e50914,#b20710);padding:30px;text-align:center;">
                            <h1 style="color:#fff;margin:0;font-size:24px;">{{ subject }}</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:30px;color:#e0e0e0;">
                            <div style="font-size:16px;line-height:1.6;white-space:pre-wrap;">{{ body }}</div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:20px 30px;text-align:center;">
                            <table cellpadding="0" cellspacing="0" style="margin:0 auto;">
                                <tr>
                                    <td style="background-color:#e50914;border-radius:6px;">
                                        <a href="{{ site_url }}" style="display:inline-block;padding:12px 30px;color:#fff;text-decoration:none;font-weight:bold;">Visit MaxCinema</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color:#0d0d0d;padding:20px;text-align:center;border-top:1px solid #222;">
                            <p style="color:#666;font-size:12px;margin:0;">MaxCinema — Your Entertainment Hub</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
