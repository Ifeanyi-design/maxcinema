<div id="sticky-footer" class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-300 shadow-[0_-2px_10px_rgba(0,0,0,0.1)] z-50 text-center pb-1">
    
    <button onclick="document.getElementById('sticky-footer').style.display='none'" class="absolute -top-6 right-2 bg-gray-800 text-white text-xs px-2 py-1 rounded-t-md font-bold uppercase tracking-wide cursor-pointer hover:bg-red-600">
        Close X
    </button>

    <div class="hidden md:block py-2">
        <div class="inline-block">
            {% if ads.sticky_desktop and ads.sticky_desktop.key %}
                <script type="text/javascript">
                    atOptions = {
                        'key' : '{{ ads.sticky_desktop.key }}',
                        'format' : 'iframe',
                        'height' : 90,
                        'width' : 728,
                        'params' : {}
                    };
                </script>
                <script async src="https://www.{{ ads.sticky_desktop.domain }}/{{ ads.sticky_desktop.key }}/invoke.js"></script>
            {% endif %}
        </div>
    </div>

    <div class="block md:hidden py-2">
        <div class="inline-block">
            {% if ads.sticky_mobile and ads.sticky_mobile.key %}
                <script type="text/javascript">
                    atOptions = {
                        'key' : '{{ ads.sticky_mobile.key }}',
                        'format' : 'iframe',
                        'height' : 50,
                        'width' : 320,
                        'params' : {}
                    };
                </script>
                <script async src="https://www.{{ ads.sticky_mobile.domain }}/{{ ads.sticky_mobile.key }}/invoke.js"></script>
            {% endif %}

        </div>
    </div>

</div>

<div class="h-[100px] md:h-[120px]"></div>
