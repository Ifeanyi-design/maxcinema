<script>
document.addEventListener("DOMContentLoaded", function () {
  const adUrl = {% if ads.pop_url %}"{{ ads.pop_url }}"{% else %}null{% endif %};
  if (!adUrl) return;

  const ua = navigator.userAgent;
  const isSafari =
    /Safari/i.test(ua) &&
    !/Chrome|Chromium|Edg|OPR|CriOS|FxiOS|Android/i.test(ua);

  const backgroundCooldown = 15 * 1000;

  // Safety wrappers for localStorage
  function safeSetItem(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function safeGetItem(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }

  function openAd() {
    safeSetItem("lastAdTime", String(Date.now()));

    if (isSafari) {
      // Safari-specific click injection
      const a = document.createElement("a");
      a.href = adUrl;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      document.body.appendChild(a);
      a.click();
      a.remove();
    } else {
      // Standard behavior for Chrome/Edge/Firefox
      const win = window.open(adUrl, "_blank");
      if (win) { try { win.blur(); window.focus(); } catch (e) {} }
    }
  }

  document.body.addEventListener("click", function (e) {
    const trigger = e.target.closest(".download-ad-trigger");

    // Logic for the download button hijack
    if (trigger && trigger.tagName === "A") {
      let clickCount = parseInt(safeGetItem("adClickCount", "0"), 10);
      clickCount++;
      safeSetItem("adClickCount", String(clickCount));

      if (clickCount % 2 !== 0) {
        e.preventDefault();
        openAd();
      }
      return;
    }

    // Background Pop Logic (Disabled for Safari as requested)
    if (isSafari) return;

    const isInteractive = e.target.closest("a") || e.target.closest("button") || e.target.closest("input");
    
    if (!isInteractive) {
      const now = Date.now();
      const lastAdTime = parseInt(safeGetItem("lastAdTime", "0"), 10);
      if (now - lastAdTime > backgroundCooldown) {
        openAd();
      }
    }
  });
});
</script>
