<script>
  window.__CC__ = "{{ country|e }}";
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const adUrl = {% if ads.pop_url %}"{{ ads.pop_url }}"{% else %}null{% endif %};
  if (!adUrl) return;

  const cc = (window.__CC__ || "XX").toUpperCase();

  const TIER1 = new Set([
    "US","GB","CA","AU","DE","FR","NL","NO","SE","FI","BE","CH","AT","IE","NZ","DK"
  ]);

  const isTier1 = TIER1.has(cc);

  const ua = navigator.userAgent;
  const isSafari =
    /Safari/i.test(ua) &&
    !/Chrome|Chromium|Edg|OPR|CriOS|FxiOS|Android/i.test(ua);

  // Tier logic
  const backgroundCooldown = isTier1 ? (365 * 24 * 60 * 60 * 1000) : (60 * 1000); // Tier1: effectively off, Tier3: 60s
  const downloadMod = isTier1 ? 3 : 2; // Tier1: 1 in 3; Tier3: every other click

  function safeSetItem(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function safeGetItem(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }

  function openAd() {
    safeSetItem("lastAdTime", String(Date.now()));

    if (isSafari) {
      const a = document.createElement("a");
      a.href = adUrl;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      document.body.appendChild(a);
      a.click();
      a.remove();
    } else {
      const win = window.open(adUrl, "_blank");
      if (win) { try { win.blur(); window.focus(); } catch (e) {} }
    }
  }

  document.body.addEventListener("click", function (e) {
    const trigger = e.target.closest(".download-ad-trigger");

    // Download button logic
    if (trigger && trigger.tagName === "A") {
      let clickCount = parseInt(safeGetItem("adClickCount", "0"), 10);
      clickCount++;
      safeSetItem("adClickCount", String(clickCount));

      // Show ad on clicks that are NOT divisible by downloadMod
      // (Tier1: show on 1st & 2nd, allow on 3rd; Tier3: show on 1st, allow on 2nd)
      if (clickCount % downloadMod !== 0) {
        e.preventDefault();
        openAd();
      }
      return;
    }

    // Background pops:
    // - Disabled for Safari
    // - Effectively disabled for Tier1 by huge cooldown
    if (isSafari) return;

    const isInteractive =
      e.target.closest("a") || e.target.closest("button") || e.target.closest("input");

    if (!isInteractive) {
      const now = Date.now();
      const lastAdTime = parseInt(safeGetItem("lastAdTime", "0"), 10);
      if (now - lastAdTime > backgroundCooldown) {
        openAd();
      }
    }
  });
});
  </script>
