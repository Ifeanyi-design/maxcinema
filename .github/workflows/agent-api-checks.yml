name: MaxCinema Agent API Checks

on:
  pull_request:
    branches: [clean-main]
    paths:
      - "app/**"
      - "tests/**"
      - "migrations/**"
      - "requirements.txt"
      - ".github/workflows/agent-api-checks.yml"

jobs:
  python-checks:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "ci-only-secret-not-for-production"
      DATABASE_URL: "sqlite:////tmp/maxcinema-ci.db"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application and tests
        run: python -m compileall -q app tests migrations

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
